spring.application.name=redsena-backend

# Configuración local segura para desarrollo; producción debe inyectar todos los valores.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/redsena}
spring.datasource.username=${DB_USERNAME:redsena}
spring.datasource.password=${DB_PASSWORD:redsena_dev_only_change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.graphql.path=/graphql
server.port=${SERVER_PORT:8080}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Identidad Firebase: sin FIREBASE_PROJECT_ID el backend arranca en modo local y las
# mutaciones siguen exigiendo una Authentication en el SecurityContext.
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# Límites y TTLs configurables; no dispersar números mágicos en los módulos.
app.feed.default-page-size=${FEED_DEFAULT_PAGE_SIZE:20}
app.feed.max-page-size=${FEED_MAX_PAGE_SIZE:50}
app.media.upload-path=${UPLOAD_PATH:./uploads}
app.media.max-file-size=${MAX_UPLOAD_SIZE:5242880}
app.idempotency.processing-ttl=${IDEMPOTENCY_PROCESSING_TTL:PT5M}
app.idempotency.completed-ttl=${IDEMPOTENCY_COMPLETED_TTL:PT24H}
app.rate-limit.post-create=${RATE_LIMIT_POST_CREATE:10}
app.rate-limit.comment-create=${RATE_LIMIT_COMMENT_CREATE:30}
app.rate-limit.upload=${RATE_LIMIT_UPLOAD:20}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
